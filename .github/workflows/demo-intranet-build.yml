name: demo-intranet-build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/intranet-demo-packages

jobs:
  linux-cli:
    runs-on: ubuntu-latest
    env:
      OPENCODE_SAFE_MODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux CLI binaries
        run: |
          set -euo pipefail
          mkdir -p out/linux-bin

          bun run ./packages/opencode/script/build.ts --single --baseline --skip-install
          GLIBC_BIN="$(
            find packages/opencode/dist -type f -path "*/opencode-linux-*/bin/opencode" |
              grep -v musl |
              head -n 1 ||
              true
          )"
          if [ -z "$GLIBC_BIN" ]; then
            echo "glibc Linux binary not found"
            exit 1
          fi
          cp "$GLIBC_BIN" out/linux-bin/opencode-glibc

          bun run ./packages/opencode/script/build.ts --single --baseline --abi=musl --skip-install
          MUSL_BIN="$(
            find packages/opencode/dist -type f -path "*/opencode-linux-*-musl/bin/opencode" |
              head -n 1 ||
              true
          )"
          if [ -z "$MUSL_BIN" ]; then
            echo "musl Linux binary not found"
            exit 1
          fi
          cp "$MUSL_BIN" out/linux-bin/opencode-musl

          chmod +x out/linux-bin/opencode-glibc out/linux-bin/opencode-musl

      - name: Create Linux demo bundle
        run: |
          set -euo pipefail
          mkdir -p out/linux
          cp out/linux-bin/opencode-glibc out/linux/opencode-glibc
          cp out/linux-bin/opencode-musl out/linux/opencode-musl
          cp demo/intranet/opencode.json out/linux/opencode.json
          cp demo/intranet/linux/install.sh out/linux/install.sh
          cp demo/intranet/README.md out/linux/README.md
          chmod +x out/linux/opencode-glibc out/linux/opencode-musl out/linux/install.sh
          tar -C out/linux -czf out/opencode-linux-cli-demo.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-linux-cli-demo
          path: out/opencode-linux-cli-demo.tar.gz

  windows-client:
    runs-on: windows-latest
    env:
      OPENCODE_SAFE_MODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows CLI sidecar binary
        run: bun run script/build.ts --single --skip-install
        working-directory: packages/opencode

      - name: Place sidecar for desktop build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packages/desktop/src-tauri/sidecars | Out-Null
          $opencodeCandidates = Get-ChildItem -Path "packages/opencode/dist" -Recurse -File |
            Where-Object {
              ($_.Name -eq "opencode.exe" -or $_.Name -eq "opencode") -and
              $_.FullName -match '[\\\\/]opencode-windows-.*[\\\\/]bin[\\\\/]'
            }
          $opencode = $opencodeCandidates |
            Sort-Object @{ Expression = {
              if ($_.Name -eq "opencode.exe") { 0 }
              elseif ($_.Name -eq "opencode") { 1 }
              else { 2 }
            }}, FullName |
            Select-Object -First 1
          if (-not $opencode) {
            Get-ChildItem -Path "packages/opencode/dist" -Recurse | Select-Object -First 200
            throw "Windows sidecar binary not found."
          }
          Copy-Item $opencode.FullName "packages/desktop/src-tauri/sidecars/opencode-cli-x86_64-pc-windows-msvc.exe" -Force

          $rgCandidates = Get-ChildItem -Path "packages/opencode/dist" -Recurse -File |
            Where-Object {
              ($_.Name -eq "rg.exe" -or $_.Name -eq "rg") -and
              $_.FullName -match '[\\\\/]opencode-windows-.*[\\\\/]bin[\\\\/]'
            }
          $rg = $rgCandidates |
            Sort-Object @{ Expression = {
              if ($_.Name -eq "rg.exe") { 0 }
              elseif ($_.Name -eq "rg") { 1 }
              else { 2 }
            }}, FullName |
            Select-Object -First 1
          if (-not $rg) {
            Get-ChildItem -Path "packages/opencode/dist" -Recurse | Select-Object -First 200
            throw "Windows ripgrep sidecar not found."
          }
          Copy-Item $rg.FullName "packages/desktop/src-tauri/sidecars/rg-x86_64-pc-windows-msvc.exe" -Force

      - name: Build Windows desktop installer
        run: bun run --cwd packages/desktop tauri build --config ./src-tauri/tauri.intranet.conf.json
        env:
          OPENCODE_SAFE_MODE: "1"

      - name: Create Windows demo bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/windows | Out-Null
          $installer = Get-ChildItem "packages/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer not found." }
          Copy-Item $installer.FullName "out/windows/OpenCode-Setup.exe" -Force
          Copy-Item "demo/intranet/opencode.json" "out/windows/opencode.json" -Force
          Copy-Item "demo/intranet/windows/install.ps1" "out/windows/install.ps1" -Force
          Copy-Item "demo/intranet/windows/install.cmd" "out/windows/install.cmd" -Force
          Copy-Item "demo/intranet/README.md" "out/windows/README.md" -Force
          Compress-Archive -Path "out/windows/*" -DestinationPath "out/opencode-windows-client-demo.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-client-demo
          path: out/opencode-windows-client-demo.zip
