name: demo-intranet-build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/intranet-demo-packages

jobs:
  linux-cli:
    runs-on: ubuntu-latest
    env:
      OPENCODE_SAFE_MODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux CLI binary
        run: bun run script/build.ts --single --baseline --skip-install
        working-directory: packages/opencode

      - name: Create Linux demo bundle
        run: |
          set -euo pipefail
          BIN_PATH="$(ls packages/opencode/dist/opencode-linux-*/bin/opencode | head -n 1)"
          mkdir -p out/linux
          cp "$BIN_PATH" out/linux/opencode
          cp demo/intranet/opencode.json out/linux/opencode.json
          cp demo/intranet/linux/install.sh out/linux/install.sh
          cp demo/intranet/README.md out/linux/README.md
          chmod +x out/linux/opencode out/linux/install.sh
          tar -C out/linux -czf out/opencode-linux-cli-demo.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-linux-cli-demo
          path: out/opencode-linux-cli-demo.tar.gz

  windows-client:
    runs-on: windows-latest
    env:
      OPENCODE_SAFE_MODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows CLI sidecar binary
        run: bun run script/build.ts --single --skip-install
        working-directory: packages/opencode

      - name: Place sidecar for desktop build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packages/desktop/src-tauri/sidecars | Out-Null
          $candidates = Get-ChildItem -Path "packages/opencode/dist" -Recurse -File |
            Where-Object {
              ($_.Name -eq "opencode.exe" -or $_.Name -eq "opencode") -and
              $_.FullName -match '[\\\\/]opencode-windows-.*[\\\\/]bin[\\\\/]'
            }
          $bin = $candidates |
            Sort-Object @{ Expression = {
              if ($_.Name -eq "opencode.exe") { 0 }
              elseif ($_.Name -eq "opencode") { 1 }
              else { 2 }
            }}, FullName |
            Select-Object -First 1
          if (-not $bin) {
            Get-ChildItem -Path "packages/opencode/dist" -Recurse | Select-Object -First 200
            throw "Windows sidecar binary not found."
          }
          Copy-Item $bin.FullName "packages/desktop/src-tauri/sidecars/opencode-cli-x86_64-pc-windows-msvc.exe" -Force

      - name: Build Windows desktop installer
        run: bun run --cwd packages/desktop tauri build --config ./src-tauri/tauri.intranet.conf.json
        env:
          OPENCODE_SAFE_MODE: "1"

      - name: Create Windows demo bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/windows | Out-Null
          $installer = Get-ChildItem "packages/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer not found." }
          Copy-Item $installer.FullName "out/windows/OpenCode-Setup.exe" -Force
          Copy-Item "demo/intranet/opencode.json" "out/windows/opencode.json" -Force
          Copy-Item "demo/intranet/windows/install.ps1" "out/windows/install.ps1" -Force
          Copy-Item "demo/intranet/windows/install.cmd" "out/windows/install.cmd" -Force
          Copy-Item "demo/intranet/README.md" "out/windows/README.md" -Force
          Compress-Archive -Path "out/windows/*" -DestinationPath "out/opencode-windows-client-demo.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-client-demo
          path: out/opencode-windows-client-demo.zip
